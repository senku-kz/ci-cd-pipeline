[project]
name = "ci-cd-pipeline"
version = "0.1.0"
description = "Учебный CI/CD pipeline: FastAPI + GitHub Actions + ИБ-сканирование + Docker + Oracle Cloud"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

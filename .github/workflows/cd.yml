name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master, test, dev]

permissions:
  packages: write
  contents: read

jobs:
  resolve-env:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.map.outputs.env_name }}
      app_port: ${{ steps.map.outputs.app_port }}
    steps:
      - id: map
        run: |
          case "${{ github.event.workflow_run.head_branch }}" in
            master) echo "env_name=master" >> "$GITHUB_OUTPUT"; echo "app_port=8000" >> "$GITHUB_OUTPUT" ;;
            test)   echo "env_name=test"   >> "$GITHUB_OUTPUT"; echo "app_port=8100" >> "$GITHUB_OUTPUT" ;;
            dev)    echo "env_name=dev"    >> "$GITHUB_OUTPUT"; echo "app_port=8200" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unmapped branch: ${{ github.event.workflow_run.head_branch }}" >&2; exit 1 ;;
          esac

  build-and-push:
    needs: resolve-env
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: vars
        run: echo "image=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - id: tags
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          ENV_NAME: ${{ needs.resolve-env.outputs.env_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAGS="${IMAGE}:${ENV_NAME}"$'\n'"${IMAGE}:${ENV_NAME}-${SHA}"
          if [ "${ENV_NAME}" = "master" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [resolve-env, build-and-push]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ needs.resolve-env.outputs.env_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Copy deploy script to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "scripts/deploy.sh"
          target: "/tmp/ci-cd-deploy-${{ needs.resolve-env.outputs.env_name }}"
          strip_components: 1
      - name: Run deploy script over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_IMAGE,IMAGE_TAG,ENV_NAME,APP_PORT
          script_stop: true
          script: |
            chmod +x /tmp/ci-cd-deploy-${ENV_NAME}/deploy.sh
            /tmp/ci-cd-deploy-${ENV_NAME}/deploy.sh
        env:
          GHCR_IMAGE: ${{ needs.build-and-push.outputs.image }}
          IMAGE_TAG: ${{ needs.resolve-env.outputs.env_name }}-${{ github.event.workflow_run.head_sha }}
          ENV_NAME: ${{ needs.resolve-env.outputs.env_name }}
          APP_PORT: ${{ needs.resolve-env.outputs.app_port }}
